spring:
  application:
    name: booking-service

server:
  port: 8081

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} correlationId=%X{correlationId} - %msg%n"


barbersaas:
  messaging:
    booking-events-topic: booking-events
    booking-created-queue: booking-created-queue
    availability-events-topic: availability-events
    availability-decided-queue: availability-decided-queue
    booking-events-dlq: booking-events-dlq
    availability-events-dlq: availability-events-dlq