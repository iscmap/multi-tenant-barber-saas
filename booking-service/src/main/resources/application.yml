spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://localhost:5432/barbersaas?currentSchema=booking
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: booking-service-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: booking
        format_sql: true
    show-sql: false

  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      endpoint: http://localhost:4566

server:
  port: 8081

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} correlationId=%X{correlationId} - %msg%n"

barbersaas:
  messaging:
    booking-events-topic: booking-events
    booking-created-queue: booking-created-queue
    availability-events-topic: availability-events
    availability-decided-queue: availability-decided-queue
    booking-events-dlq: booking-events-dlq
    availability-events-dlq: availability-events-dlq
    booking-created-kafka-topic: booking-created-kafka
    availability-kafka-consumer-group: availability-booking-created-group
    kafka-bootstrap-servers: localhost:9092
    kafka-listener-auto-startup: true