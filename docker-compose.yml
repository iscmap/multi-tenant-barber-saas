services:
  postgres:
    image: postgres:16
    container_name: barber-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barbersaas}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-barbersaas}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3.8
    container_name: barber-localstack
    environment:
      SERVICES: sns,sqs,dynamodb
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      DEBUG: 1
    ports:
      - "4566:4566"
    volumes:
      - ./infra/docker/localstack/init:/etc/localstack/init
      - localstack_data:/var/lib/localstack
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:4566/_localstack/health || exit 1"
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.1.2
    container_name: barber-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-init:
    image: apache/kafka:4.1.2
    container_name: barber-kafka-init
    depends_on:
      kafka:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          sleep 2
        done

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic ${BOOKING_CREATED_KAFKA_TOPIC:-booking-created-kafka} \
          --partitions 3 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --list

        echo "Kafka topics initialized"

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    image: barber-booking-service:8.4
    container_name: barber-booking-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8081

      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-barbersaas}?currentSchema=booking
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      BOOKING_CREATED_KAFKA_TOPIC: ${BOOKING_CREATED_KAFKA_TOPIC:-booking-created-kafka}
      AVAILABILITY_KAFKA_CONSUMER_GROUP: ${AVAILABILITY_KAFKA_CONSUMER_GROUP:-availability-booking-created-group}
      KAFKA_LISTENER_AUTO_STARTUP: ${KAFKA_LISTENER_AUTO_STARTUP:-true}

      BOOKING_EVENTS_TOPIC: ${BOOKING_EVENTS_TOPIC:-booking-events}
      BOOKING_CREATED_QUEUE: ${BOOKING_CREATED_QUEUE:-booking-created-queue}
      AVAILABILITY_EVENTS_TOPIC: ${AVAILABILITY_EVENTS_TOPIC:-availability-events}
      AVAILABILITY_DECIDED_QUEUE: ${AVAILABILITY_DECIDED_QUEUE:-availability-decided-queue}
      BOOKING_EVENTS_DLQ: ${BOOKING_EVENTS_DLQ:-booking-events-dlq}
      AVAILABILITY_EVENTS_DLQ: ${AVAILABILITY_EVENTS_DLQ:-availability-events-dlq}

    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8081/actuator/health/readiness || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  availability-service:
    build:
      context: .
      dockerfile: availability-service/Dockerfile
    image: barber-availability-service:8.4
    container_name: barber-availability-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8082

      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-barbersaas}?currentSchema=availability
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      BOOKING_CREATED_KAFKA_TOPIC: ${BOOKING_CREATED_KAFKA_TOPIC:-booking-created-kafka}
      AVAILABILITY_KAFKA_CONSUMER_GROUP: ${AVAILABILITY_KAFKA_CONSUMER_GROUP:-availability-booking-created-group}
      KAFKA_LISTENER_AUTO_STARTUP: ${KAFKA_LISTENER_AUTO_STARTUP:-true}

      BOOKING_EVENTS_TOPIC: ${BOOKING_EVENTS_TOPIC:-booking-events}
      BOOKING_CREATED_QUEUE: ${BOOKING_CREATED_QUEUE:-booking-created-queue}
      AVAILABILITY_EVENTS_TOPIC: ${AVAILABILITY_EVENTS_TOPIC:-availability-events}
      AVAILABILITY_DECIDED_QUEUE: ${AVAILABILITY_DECIDED_QUEUE:-availability-decided-queue}
      BOOKING_EVENTS_DLQ: ${BOOKING_EVENTS_DLQ:-booking-events-dlq}
      AVAILABILITY_EVENTS_DLQ: ${AVAILABILITY_EVENTS_DLQ:-availability-events-dlq}

    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8082/actuator/health/readiness || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  localstack_data:
  kafka_data: