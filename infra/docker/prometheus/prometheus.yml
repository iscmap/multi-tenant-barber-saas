global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: booking-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - booking-service:8081

  - job_name: availability-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - availability-service:8082