AWSTemplateFormatVersion: "2010-09-09"

Description: Amazon EKS cluster for Multi-Tenant Barber SaaS development environment

Parameters:
  ProjectName:
    Type: String
    Default: barber-saas

  Environment:
    Type: String
    Default: dev

  KubernetesVersion:
    Type: String
    Default: "1.36"

  PrivateSubnet1Id:
    Type: AWS::EC2::Subnet::Id

  PrivateSubnet2Id:
    Type: AWS::EC2::Subnet::Id

  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email endpoint for CloudWatch alarm notifications


Conditions:
  HasAlertEmail: !Not
    - !Equals
      - !Ref AlertEmail
      - ""


Resources:

  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-eks-cluster-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - eks.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


  EksNodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-eks-node-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


  CloudWatchObservabilityRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${Environment}-cloudwatch-observability-role"

      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - pods.eks.amazonaws.com
            Action:
              - sts:AssumeRole
              - sts:TagSession

      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


  EksCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub "${ProjectName}-${Environment}"

      Version: !Ref KubernetesVersion

      RoleArn: !GetAtt EksClusterRole.Arn

      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true

      ResourcesVpcConfig:
        SubnetIds:
          - !Ref PrivateSubnet1Id
          - !Ref PrivateSubnet2Id

        EndpointPublicAccess: true
        EndpointPrivateAccess: true

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


  EksNodeGroup:
    Type: AWS::EKS::Nodegroup
    DependsOn:
      - EksCluster

    Properties:
      ClusterName: !Ref EksCluster

      NodegroupName: !Sub "${ProjectName}-${Environment}-nodes"

      NodeRole: !GetAtt EksNodeRole.Arn

      Subnets:
        - !Ref PrivateSubnet1Id
        - !Ref PrivateSubnet2Id

      AmiType: AL2023_x86_64_STANDARD

      CapacityType: ON_DEMAND

      InstanceTypes:
        - t3.medium

      DiskSize: 20

      ScalingConfig:
        MinSize: 1
        DesiredSize: 1
        MaxSize: 2

      UpdateConfig:
        MaxUnavailable: 1

      Labels:
        environment: !Ref Environment
        project: !Ref ProjectName

      Tags:
        Project: !Ref ProjectName
        Environment: !Ref Environment


  OperationsAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub "${ProjectName}-${Environment}-operations-alerts"

      Tags:
        - Key: Project
          Value: !Ref ProjectName

        - Key: Environment
          Value: !Ref Environment


  OperationsEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      TopicArn: !Ref OperationsAlertTopic
      Protocol: email
      Endpoint: !Ref AlertEmail


  HighNodeCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-high-node-cpu"

      AlarmDescription: EKS node CPU utilization is above 80 percent

      Namespace: ContainerInsights
      MetricName: node_cpu_utilization

      Dimensions:
        - Name: ClusterName
          Value: !Sub "${ProjectName}-${Environment}"

      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2

      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold

      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref OperationsAlertTopic

      OKActions:
        - !Ref OperationsAlertTopic


  HighNodeMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-high-node-memory"

      AlarmDescription: EKS node memory utilization is above 80 percent

      Namespace: ContainerInsights
      MetricName: node_memory_utilization

      Dimensions:
        - Name: ClusterName
          Value: !Sub "${ProjectName}-${Environment}"

      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      DatapointsToAlarm: 2

      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold

      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref OperationsAlertTopic

      OKActions:
        - !Ref OperationsAlertTopic


  FailedNodeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${ProjectName}-${Environment}-failed-node"

      AlarmDescription: One or more EKS worker nodes are reporting a failed condition

      Namespace: ContainerInsights
      MetricName: cluster_failed_node_count

      Dimensions:
        - Name: ClusterName
          Value: !Sub "${ProjectName}-${Environment}"

      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      DatapointsToAlarm: 1

      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

      TreatMissingData: notBreaching

      AlarmActions:
        - !Ref OperationsAlertTopic

      OKActions:
        - !Ref OperationsAlertTopic


  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "${ProjectName}-${Environment}-operations"

      DashboardBody: !Sub |
        {
          "start": "-PT3H",
          "periodOverride": "inherit",
          "widgets": [
            {
              "type": "text",
              "x": 0,
              "y": 0,
              "width": 24,
              "height": 2,
              "properties": {
                "markdown": "# Barber SaaS — DEV Operations\nEKS cluster: **${ProjectName}-${Environment}**"
              }
            },
            {
              "type": "alarm",
              "x": 0,
              "y": 2,
              "width": 24,
              "height": 5,
              "properties": {
                "title": "Operational Alarms",
                "alarms": [
                  "${HighNodeCpuAlarm.Arn}",
                  "${HighNodeMemoryAlarm.Arn}",
                  "${FailedNodeAlarm.Arn}"
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 7,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "EKS Node CPU Utilization",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 60,
                "stat": "Average",
                "yAxis": {
                  "left": {
                    "min": 0,
                    "max": 100
                  }
                },
                "metrics": [
                  [
                    "ContainerInsights",
                    "node_cpu_utilization",
                    "ClusterName",
                    "${ProjectName}-${Environment}"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 7,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "EKS Node Memory Utilization",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stacked": false,
                "period": 60,
                "stat": "Average",
                "yAxis": {
                  "left": {
                    "min": 0,
                    "max": 100
                  }
                },
                "metrics": [
                  [
                    "ContainerInsights",
                    "node_memory_utilization",
                    "ClusterName",
                    "${ProjectName}-${Environment}"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 13,
              "width": 12,
              "height": 5,
              "properties": {
                "title": "EKS Worker Nodes",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "period": 60,
                "stat": "Average",
                "metrics": [
                  [
                    "ContainerInsights",
                    "cluster_node_count",
                    "ClusterName",
                    "${ProjectName}-${Environment}"
                  ]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 13,
              "width": 12,
              "height": 5,
              "properties": {
                "title": "Running Pods — default namespace",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "period": 60,
                "stat": "Average",
                "metrics": [
                  [
                    "ContainerInsights",
                    "namespace_number_of_running_pods",
                    "Namespace",
                    "default",
                    "ClusterName",
                    "${ProjectName}-${Environment}"
                  ]
                ]
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 18,
              "width": 24,
              "height": 7,
              "properties": {
                "title": "Booking + Availability — Recent Logs",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/containerinsights/${ProjectName}-${Environment}/application' | fields @timestamp, @message, @logStream\n| filter @message like /booking-service|availability-service/\n| sort @timestamp desc\n| limit 100"
              }
            },
            {
              "type": "log",
              "x": 0,
              "y": 25,
              "width": 24,
              "height": 7,
              "properties": {
                "title": "Application WARN / ERROR",
                "region": "${AWS::Region}",
                "view": "table",
                "query": "SOURCE '/aws/containerinsights/${ProjectName}-${Environment}/application' | fields @timestamp, @message, @logStream\n| filter @message like /booking-service|availability-service/\n| filter @message like /WARN|ERROR/\n| sort @timestamp desc\n| limit 100"
              }
            }
          ]
        }


Outputs:

  ClusterName:
    Description: Amazon EKS cluster name
    Value: !Ref EksCluster

  ClusterArn:
    Description: EKS cluster ARN
    Value: !GetAtt EksCluster.Arn

  ClusterEndpoint:
    Description: Kubernetes API endpoint
    Value: !GetAtt EksCluster.Endpoint

  ClusterRoleArn:
    Description: EKS cluster IAM role
    Value: !GetAtt EksClusterRole.Arn

  NodeRoleArn:
    Description: EKS worker node IAM role
    Value: !GetAtt EksNodeRole.Arn

  NodeGroupName:
    Description: EKS managed node group
    Value: !Ref EksNodeGroup

  CloudWatchObservabilityRoleArn:
    Description: IAM role for CloudWatch Observability EKS add-on
    Value: !GetAtt CloudWatchObservabilityRole.Arn

  OperationsDashboardName:
    Description: CloudWatch operations dashboard name
    Value: !Ref OperationsDashboard

  OperationsAlertTopicArn:
    Description: SNS topic for operational alerts
    Value: !Ref OperationsAlertTopic