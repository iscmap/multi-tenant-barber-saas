spring:
  application:
    name: availability-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/barbersaas?currentSchema=availability}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: availability-service-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: availability
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    default-schema: availability
    schemas: availability
    baseline-on-migrate: false

  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true

barbersaas:
  messaging:
    booking-events-topic: ${BOOKING_EVENTS_TOPIC:booking-events}
    booking-events-topic-arn: ${BOOKING_EVENTS_TOPIC_ARN:}
    booking-created-queue: ${BOOKING_CREATED_QUEUE:booking-created-queue}
    availability-events-topic: ${AVAILABILITY_EVENTS_TOPIC:availability-events}
    availability-events-topic-arn: ${AVAILABILITY_EVENTS_TOPIC_ARN:}
    availability-decided-queue: ${AVAILABILITY_DECIDED_QUEUE:availability-decided-queue}
    booking-events-dlq: ${BOOKING_EVENTS_DLQ:booking-events-dlq}
    availability-events-dlq: ${AVAILABILITY_EVENTS_DLQ:availability-events-dlq}
    booking-created-kafka-topic: ${BOOKING_CREATED_KAFKA_TOPIC:booking-created-kafka}
    availability-kafka-consumer-group: ${AVAILABILITY_KAFKA_CONSUMER_GROUP:availability-booking-created-group}
    kafka-bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    kafka-listener-auto-startup: ${KAFKA_LISTENER_AUTO_STARTUP:true}